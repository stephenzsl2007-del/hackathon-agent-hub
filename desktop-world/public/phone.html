<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6efd9">
  <title>一起照顾小岛 · 息屿</title>
  <link rel="stylesheet" href="/phone.css">
</head>
<body>
  <main>
    <header><span class="brand">息屿 <span>BREATHING ISLAND</span></span><span id="status" class="status" role="status"><i></i>连接小岛中</span></header>
    <section class="intro">
      <p class="eyebrow">A LITTLE HELP FROM YOU</p>
      <h1>把一点温柔，<br>送到小岛上。</h1>
      <p class="subtitle">手机轻轻一碰，电脑里的世界就会回应。</p>
      <svg class="landscape" viewBox="0 0 320 74" aria-hidden="true" shape-rendering="crispEdges">
        <path fill="#e4eac8" d="M0 61h17v-8h22v-7h18v8h24v8h21v-13h26v-8h22v9h29v13h20v-8h17v-7h24v10h27v-10h19v-8h19v12h15v22H0z"/>
        <path fill="#b4c8a0" d="M0 69h41v-5h29v5h70v-4h34v4h62v-6h36v6h48v5H0z"/>
        <path fill="#78996c" d="M42 55h4v-8h4v8h4v-14h4v28H42zm209 4h4v-9h4v9h4v-17h4v27h-16z"/>
        <path fill="#efb17c" d="M43 38h12v4H43zm-4 4h20v8H39zm4 8h12v4H43z"/>
        <path fill="#f8d993" d="M47 42h4v8h-4z"/>
        <path fill="#c88984" d="M259 34h8v4h-8zm-4 4h16v8h-16zm4 8h8v4h-8z"/>
        <path fill="#fff5d9" d="M119 49h4V37h4v12h8V37h4v16h4v12h-28V53h4z"/>
        <path fill="#6d7765" d="M123 55h2v2h-2zm12 0h2v2h-2z"/>
        <path fill="#f4c4b3" d="M129 59h4v2h-4z"/>
        <path fill="#d9e4da" d="M180 24h8v-4h16v4h8v8h-32z"/>
        <path fill="#cddbbb" d="M23 16h10v-5h18v5h10v8H23z"/>
      </svg>
    </section>
    <section class="actions" aria-label="小岛互动">
      <button data-action="wind" class="action wind" disabled>
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 10h17V6h6v4h-3v3H3zm4 7h22v3H7zm-4 7h15v3h-3v3h-6v-3H3z" fill="currentColor"/></svg>
        <strong>送一阵风</strong><span>长按 · 花草一起摇曳</span>
      </button>
      <button data-action="rain" class="action rain" disabled>
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 5h13v4h6v4h3v7H3V10h4zM6 24h3v5H6zm9-2h3v5h-3zm9 2h3v5h-3z" fill="currentColor"/></svg>
        <strong>下一场雨</strong><span>轻点 · 唤醒小小花苞</span>
      </button>
      <button data-action="seed" class="action seed" disabled>
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 7h9v4h5v7h-5v-3H7v-4H3zm17-4h9v8h-4v4h-6v14h-3V13h4z" fill="currentColor"/></svg>
        <strong>种一朵花</strong><span>轻点 · 留下一点颜色</span>
      </button>
      <button data-action="food" class="action food" disabled>
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M19 3h4v6h6v4H19zM15 11h8v8h-4v4h-4v4h-4v3H7v-7h4v-8h4z" fill="currentColor"/></svg>
        <strong>喂小动物</strong><span>轻点 · 等一位朋友靠近</span>
      </button>
      <button data-action="tide" class="action tide" disabled>
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 8h8v4h9V8h9v4h-6v4H8v-4H3zm0 12h8v4h9v-4h9v4h-6v4H8v-4H3z" fill="currentColor"/></svg>
        <strong>唤起潮汐</strong><span>轻点 · 海水轻轻漫上来</span>
      </button>
      <button data-action="fireflies" class="action fireflies" disabled>
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M15 2h3v8h7v3h-7v7h-3v-7H8v-3h7zM5 22h3v3h3v3H8v3H5v-3H2v-3h3zm20-4h3v3h3v3h-3v3h-3v-3h-3v-3h3z" fill="currentColor"/></svg>
        <strong>放飞萤火</strong><span>轻点 · 点亮一小片夜色</span>
      </button>
    </section>
    <div class="response" id="response" role="status">正在寻找与你相连的小岛…</div>
    <footer><span id="room">同一片小岛</span><span>让日常，长出一点自然。</span></footer>
    <p class="connection-note">手机和电脑需连接同一 Wi-Fi。若无法连接，可使用手机热点让电脑加入，再从电脑重新扫码。</p>
  </main>
  <script src="/phone.js"></script>
</body>
</html>
